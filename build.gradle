plugins {
    id 'java'
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '7.0.36'
}

group = 'com.agustinbenitez.voxelview3d'
version = '26.1-1.0.0'

base {
    archivesName = 'map-3d-usseewa'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
}

minecraft {
    mappings channel: 'official', version: '26.1'

    runs {
        configureEach {
            workingDir = layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'forge.logging.console.level', 'debug'
            systemProperty 'forge.enabledGameTestNamespaces', 'voxelview3d'
        }

        register('client')

        register('server') {
            args '--nogui'
        }

        register('gameTestServer')
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency('net.minecraftforge:forge:26.1-62.0.9')
}

// ForgeGradle 7.0.35 publishes runsJson as a value mapped from the metadata
// task output directory. Gradle 9.3 rejects that value when runClient wires its
// inputs, so give the generated file the same path explicitly.
tasks.configureEach {
    if (name == 'slimeLauncherMetadataForForge') {
        runsJson.set(layout.buildDirectory.file(
                'minecraftforge/forgegradle/slimeLauncherMetadataForForge/launcher/runs.json'
        ))
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: '26.1',
            minecraft_version_range: '[26.1,27.0)',
            forge_version: '62.0.9',
            forge_version_range: '[62.0.9,)',
            loader_version_range: '[62,)',
            mod_id: 'voxelview3d',
            mod_name: 'Map 3d usseewa',
            mod_license: 'All Rights Reserved',
            mod_version: '26.1-1.0.0',
            mod_authors: 'Agustin Benitez',
            mod_description: 'Client-side 3D map renderer'
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                "Specification-Title"     : "voxelview3d",
                "Specification-Vendor"    : "voxelview3dsareus",
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : "voxelview3dsareus",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
